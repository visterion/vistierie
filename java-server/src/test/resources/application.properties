# Test-only overrides. Loaded on top of src/main/resources/application.yaml.
# Cap connection-pool size so each @SpringBootTest context only uses a couple
# of Postgres connections; with many context variants a default pool of 10
# can exhaust the testcontainer's max_connections.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
# Push the batch poller out of the way during tests; integration tests that
# care about it override this property explicitly via @SpringBootTest.
vistierie.agents.batch.poll-millis=600000
# Same treatment for the agent scheduler. The Postgres testcontainer is shared
# by the whole JVM and is never truncated between classes, so scheduled agents
# inserted by one test class stay visible to every later one. With the
# production 30s tick the timer fires those leftovers mid-run of an unrelated
# test; the dispatched run then drains the shared StubLlmProvider script queue,
# and the test that scripted that turn silently gets the provider's empty
# end_turn fallback instead (surfacing as "output_schema: parse: null").
# Scheduler tests are unaffected: they drive AgentScheduler.tick() directly,
# except SchedulerE2ETest which overrides this property back down to 200ms.
vistierie.agents.scheduler.tick-millis=3600000
